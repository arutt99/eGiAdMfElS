<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b2030">
  <meta name="description" content="Fishing: a roll-and-write dice game. Launch boats, haul fish and build up the wharf.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fishing</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/alegreya-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/sheet-boats.webp" as="image">
  <link rel="preload" href="assets/sheet-harbor.webp" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header id="top" class="hud">
      <div class="bar">
        <button id="menu-btn" class="icon-btn" aria-label="Pause and menu"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
        <div id="tabs" role="tablist" aria-label="Sheets"></div>
        <button id="undo-btn" class="icon-btn" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      </div>
      <div id="status" aria-label="Game status">
        <div class="chip" id="st-score" title="Your score"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg><b>0</b><span class="unit">VP</span></div>
        <div class="chip" id="st-coins" title="Coins"><i class="coin" aria-hidden="true"></i><b>0</b><span class="sub"></span></div>
        <div class="chip" id="st-round"><span class="lbl"></span><span class="pips" aria-hidden="true"></span></div>
        <div id="who" class="chip seg" role="group" aria-label="Whose sheet" hidden><span class="seg-thumb" aria-hidden="true"></span><button data-view="you" aria-pressed="true"><span class="lbl">You</span><b>0</b></button><button data-view="ai" aria-pressed="false"><span class="lbl">AI</span><b>0</b></button></div>
      </div>
    </header>
    <div id="stage"><div id="pages"></div></div>
    <div id="above-dock"><div id="news" role="status" aria-live="polite" hidden></div><div id="choices" role="group" hidden></div></div>
    <footer id="dock" class="hud">
      <div id="opp" hidden><div class="face" aria-hidden="true"></div><span class="name"></span><span class="think" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div id="bubble" role="status" aria-live="polite" hidden></div>
      <div id="prompt" aria-live="polite"></div>
      <div id="controls">
        <div id="dice" role="group" aria-label="Dice"></div>
        <div id="actions"></div>
      </div>
    </footer>
  </main>
  <section id="title" aria-labelledby="title-h" hidden>
    <svg class="t-bg" viewBox="0 740 1100 270" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="assets/sheet-boats.webp" width="1100" height="1429"/></svg>
    <div class="t-inner">
      <h1 id="title-h"><svg class="t-logo" viewBox="10 1120 270 168" role="img" aria-label="Fishing"><image href="assets/sheet-boats.webp" width="1100" height="1429"/></svg></h1>
      <p class="t-sub">A roll-and-write dice game</p>
      <div class="t-dice" aria-hidden="true"><img src="assets/dice/lobster.webp" alt=""><img src="assets/dice/harbor.webp" alt=""><img src="assets/dice/oyster.webp" alt=""></div>
      <div class="t-menu"></div>
      <a class="t-all" href="../../">All games</a>
    </div>
  </section>
  <div id="coach" hidden><div class="coach-spot"></div><div class="coach-tip" role="dialog" aria-live="polite"></div></div>
  <div id="fx" aria-live="polite"></div>
  <div id="info" role="dialog" aria-modal="false" aria-labelledby="info-title" hidden></div>
  <dialog id="dlg"></dialog>
  <noscript><p class="noscript">Fishing needs JavaScript. Enable it and reload.</p></noscript>
  <script type="module" src="app.mjs"></script>
</body>
</html>
